[build]
  command = "pnpm --filter @pitchfire/shared build && pnpm --filter @pitchfire/web build"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION            = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  API_URL                 = "https://pitchfire-api.up.railway.app"

[[headers]]
  for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
