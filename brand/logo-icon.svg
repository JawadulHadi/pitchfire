<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" role="img" aria-label="PitchFire icon mark">
  <style>
    @keyframes float  { 0%,100%{transform:translateY(0)}  50%{transform:translateY(-3px)} }
    @keyframes glow-p { 0%,100%{opacity:.55}              50%{opacity:.9} }
    .fl { animation:float  4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 90% }
    .gl { animation:glow-p 3s ease-in-out infinite }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
    <linearGradient id="fo" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="fm" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="fc" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <ellipse cx="24" cy="44" rx="16" ry="7" fill="url(#glow)" class="gl"/>
  <g class="fl">
    <path d="M24,43 C13,43 6,35 6,26 C6,16 12,8 21,5 Q22.5,3.5 24,3 Q25.5,3.5 27,5 C36,8 42,16 42,26 C42,35 35,43 24,43Z" fill="url(#fo)" filter="url(#sg)"/>
    <path d="M24,38 C17,37 12,31 12,25 C12,18 17,12 22.5,9.5 Q23.3,9 24,8.5 Q24.7,9 25.5,9.5 C31,12 36,18 36,25 C36,31 31,37 24,38Z" fill="url(#fm)" opacity=".75"/>
    <path d="M24,32 C20,31 17,28 17,25 C17,21 20,17.5 23.5,16 L24,15.5 L24.5,16 C28,17.5 31,21 31,25 C31,28 28,31 24,32Z" fill="url(#fc)" opacity=".6"/>
    <circle cx="24" cy="4.5" r="1.8" fill="#FEF9C3" opacity=".95"/>
  </g>
</svg>