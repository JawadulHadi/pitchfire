<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="200" height="200" role="img" aria-label="PitchFire icon mark">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <radialGradient id="baseGlow" cx="50%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
    <rect width="48" height="48" rx="11" fill="url(#bg)"/>
    <!-- Violet base glow -->
      <ellipse cx="24" cy="44" rx="16" ry="7" fill="url(#baseGlow)"/>
      <!-- Outer flame body -->
        <path d="     M24,43     C13,43 6,35 6,26     C6,16 12,8 21,5     Q22.5,3.5 24,3     Q25.5,3.5 27,5     C36,8 42,16 42,26     C42,35 35,43 24,43Z   " fill="url(#flameOuter)" filter="url(#softGlow)"/>
        <!-- Mid flame — inner layer -->
          <path d="     M24,38     C17,37 12,31 12,25     C12,18 17,12 22.5,9.5     Q23.3,9 24,8.5     Q24.7,9 25.5,9.5     C31,12 36,18 36,25     C36,31 31,37 24,38Z   " fill="url(#flameMid)" opacity="0.75"/>
          <!-- Core — hottest part -->
            <path d="     M24,32     C20,31 17,28 17,25     C17,21 20,17.5 23.5,16     L24,15.5     L24.5,16     C28,17.5 31,21 31,25     C31,28 28,31 24,32Z   " fill="url(#flameCore)" opacity="0.6"/>
            <!-- Tip spark -->
              <circle cx="24" cy="4.5" r="1.8" fill="#FEF9C3" opacity="0.95"/>
            </svg>